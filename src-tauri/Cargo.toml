[package]
name = "firstmate"
version = "0.1.1" # x-release-please-version
description = "First Mate — hotkey-summoned desktop assistant"
authors = ["you"]
edition = "2021"

# Alpha quality gate: any rustc or clippy diagnostic fails the build.
# Mirrors the frontend's eslint --max-warnings 0.
[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "firstmate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
lmkit = { version = "0.1.1", default-features = false, features = ["openai", "ollama", "anthropic", "chat"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
