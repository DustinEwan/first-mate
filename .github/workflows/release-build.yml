name: Release Build

# Triggered by the Release PR workflow completing on main — that workflow
# creates the GitHub Release, but releases published via GITHUB_TOKEN do
# NOT fire `on: release` for other workflows (Actions loop protection), so
# workflow_run is the reliable hook. workflow_dispatch allows a manual
# (re)build against the latest release.

on:
  workflow_run:
    workflows: ["Release PR"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: windows-latest
    # checkout@v4 isolates git config (GIT_CONFIG_GLOBAL), so the runner's
    # system-level core.autocrlf/core.eol must be overridden via
    # GIT_CONFIG_COUNT env, or the checkout is CRLF and prettier
    # (endOfLine: lf) fails on every file.
    env:
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = gh api repos/$env:GITHUB_REPOSITORY/releases/latest --jq .tag_name
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater (minisign) signing — NOT Authenticode. Produces the
          # .sig files and latest.json the in-app updater verifies.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseTag: ${{ steps.tag.outputs.tag }}
          args: --target x64
