name: Debug EOL
on: workflow_dispatch
jobs:
  probe:
    runs-on: windows-latest
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          git config core.autocrlf
          $bytes = [System.IO.File]::ReadAllBytes("tsconfig.json")
          "has CRLF: $($bytes -contains 13)"
          npx prettier --version
          npx prettier --check tsconfig.json
          npx prettier tsconfig.json | Out-File probe.out.json -Encoding ascii
          $a = [System.IO.File]::ReadAllBytes("tsconfig.json")
          $b = [System.IO.File]::ReadAllBytes("probe.out.json")
          "len in: $($a.Length) out: $($b.Length)"
